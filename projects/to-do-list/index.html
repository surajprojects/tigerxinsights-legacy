<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do List</title>
    <link
      rel="stylesheet"
      href="https://surajprojects.github.io/tigerxinsights-legacy/projects/to-do-list/custom.css"
    />
    <link
      rel="icon"
      href="https://surajprojects.github.io/tigerxinsights-legacy/images/favicon.ico"
      type="image/x-icon"
    />
  </head>
  <body>
    <main id="container">
      <h1 id="containerHead">To-do List</h1>
      <form action="#">
        <input type="text" name="newItem" id="newItem" />
        <button id="btnAddItem">Add</button>
      </form>
      <ul id="listContainer"></ul>
      <p id="msgCheck" class="msg">No items in the list yet!!!</p>
    </main>
    <script src="https://surajprojects.github.io/tigerxinsights-legacy/projects/to-do-list/app.js"></script>
  </body>
</html>
